name: Publish TibuOS v0.1.12.4 update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'release: publish TibuOS v0.1.12.4 update package' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out update repository
        uses: actions/checkout@v4

      - name: Download and verify release artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-4928-81fd-bbf3-3c8cb110c357/raw?se=2026-08-06T10%3A58%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=4df748c1-a450-5de9-b577-a6f1fa4f5e01&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T06%3A12%3A00Z&ske=2026-08-07T06%3A12%3A00Z&sks=b&skv=2026-02-06&sig=SV/onp3K8f8sSYoO0UxEvQYGNqeLifYMQztUKEhcmJA%3D"
          EXPECTED_SHA256: "f888bf01e1f44ad79f4503484abc6631a57695a08e15c84b2386960d0029904f"
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/tibuos-artifacts.zip
          mkdir -p /tmp/tibuos-artifacts
          unzip -q /tmp/tibuos-artifacts.zip -d /tmp/tibuos-artifacts
          echo "$EXPECTED_SHA256  /tmp/tibuos-artifacts/TibuOS-v0.1.12.4.updatetibu" | sha256sum --check --strict

      - name: Publish versioned and latest update files
        env:
          EXPECTED_SHA256: "f888bf01e1f44ad79f4503484abc6631a57695a08e15c84b2386960d0029904f"
        run: |
          mkdir -p v0.1.12.4
          cp /tmp/tibuos-artifacts/TibuOS-v0.1.12.4.updatetibu v0.1.12.4/TibuOS-v0.1.12.4.updatetibu
          cp /tmp/tibuos-artifacts/TibuOS-v0.1.12.4.updatetibu latest.updatetibu
          printf '%s  %s\n' "$EXPECTED_SHA256" "TibuOS-v0.1.12.4.updatetibu" > v0.1.12.4/TibuOS-v0.1.12.4.updatetibu.sha256
          printf '%s  %s\n' "$EXPECTED_SHA256" "latest.updatetibu" > latest.updatetibu.sha256
          git config user.name "TibuOS Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.updatetibu latest.updatetibu.sha256 v0.1.12.4
          git commit -m "release: host TibuOS v0.1.12.4 update package"
          git push origin HEAD:main
